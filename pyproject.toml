[project]
name = "final-project"
version = "0.1.0"
description = "Local MLX experiments comparing LoRA and persistent ICL on a synthetic Python language"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["mlx-lm[train]>=0.31.0,<0.33", "datasets>=4,<5", "pyyaml>=6", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
final-project = "final_project.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
