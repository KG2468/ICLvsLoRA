[model]
source = "Qwen/Qwen3.5-2B"
revision = "main"
directory = "models/qwen3.5-2b"
precision = "fp16" # fp8 = MXFP8 weight quantization; int8 = affine integer weights

[experiment]
name = "full-keywords-v4-reviewed-gpu-v2"
data_dir = "data/benchmarks"
output_dir = "runs"
sizes = [16, 64, 256]
seeds = [0, 1, 2]
benchmarks = ["humaneval_synthetic", "humaneval_python", "aime2024", "aime2025", "gpqa"]

[training]
rank = 8
alpha = 16
num_layers = 16
batch_size = 1
epochs = 3
learning_rate = 0.0001
max_seq_length = 8192
grad_checkpoint = true
validation_examples = 16

[generation]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
max_tokens = 2048
max_context = 131072
prefill_step_size = 512
enable_thinking = true
prefix_cache = true
max_workers = 2 # automatic memory-based admission; 1 forces serial evaluation

[evaluation]
limit = 0 # zero means every task
timeout = 10
sandbox = "macos"
